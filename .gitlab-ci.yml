# Builds and lints atvOS Launcher on GitLab's shared Linux runners. .github/workflows/ci.yml runs the same build on
# GitHub. A version tag (v1.0, v1.0-pre.3) also puts the APKs, the app bundle and their SHA-256 digests (SHA256SUMS)
# in the package registry, and makes a release that links to them.
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - app/**/*
        - gradle/**/*
        - "*.gradle.kts"
        - gradle.properties
        - gradlew
        - .gitlab-ci.yml

stages:
  - build
  - release

build:
  stage: build
  image: eclipse-temurin:21-jdk-noble
  timeout: 30 minutes
  variables:
    ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    CMDLINE_TOOLS: commandlinetools-linux-16111833_latest.zip
    # The runner writes a provenance statement (SLSA) for the artifacts of the job: artifacts-metadata.json.
    RUNNER_GENERATE_ARTIFACTS_METADATA: "true"
  cache:
    key: android-37-build-tools-36-gradle-9.8.1
    paths:
      - .android-sdk/
      - .gradle-home/caches/
      - .gradle-home/wrapper/
  before_script:
    - command -v curl > /dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends curl > /dev/null)
    # The command-line tools, the Android platform and the build tools, from the cache if they are there.
    - |
      if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        curl -fsSL -o /tmp/tools.zip "https://dl.google.com/android/repository/$CMDLINE_TOOLS"
        (cd /tmp && jar xf tools.zip)
        mv /tmp/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
        chmod +x "$ANDROID_HOME/cmdline-tools/latest/bin/"*
      fi
    # GitLab runs the script with pipefail: "yes" in a pipe ends with SIGPIPE, so it comes from a process substitution.
    - '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null < <(yes)'
    - '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null'
    # The upload key, if the project has the signing variables. Without them, the release build uses the debug key.
    - |
      if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
        printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
          "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > keystore.properties
      fi
  script:
    - ./gradlew build bundleRelease
    # A version tag: the files with release names, their digests, and a copy in the generic package registry.
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        mkdir dist
        cp app/build/outputs/apk/release/app-release.apk "dist/atvos-launcher-$CI_COMMIT_TAG.apk"
        cp app/build/outputs/bundle/release/app-release.aab "dist/atvos-launcher-$CI_COMMIT_TAG.aab"
        cp app/build/outputs/apk/debug/app-debug.apk "dist/atvos-launcher-$CI_COMMIT_TAG-debug.apk"
        (cd dist && sha256sum -- *.apk *.aab > SHA256SUMS && cat SHA256SUMS)
        for f in dist/*; do
          curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
            "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/atvos-launcher/$CI_COMMIT_TAG/$(basename "$f")"
          echo
        done
      fi
  artifacts:
    name: "atvos-launcher-$CI_COMMIT_REF_SLUG"
    when: always
    paths:
      - app/build/outputs/apk/debug/app-debug.apk
      - app/build/outputs/apk/release/app-release.apk
      - app/build/outputs/bundle/release/app-release.aab
      - app/build/reports/lint-results-*.html
      - dist/
    expire_in: 14 days

# The release page of a version tag, with links to the files in the package registry.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs: [build]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  script:
    - echo "Release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "atvOS Launcher $CI_COMMIT_TAG"
    description: |
      atvOS Launcher $CI_COMMIT_TAG, built and linted by GitLab CI.

      - `atvos-launcher-$CI_COMMIT_TAG.apk`: the release build, to install with `adb install`. It is signed with the upload key if the project has the signing variables, else with a debug key.
      - `atvos-launcher-$CI_COMMIT_TAG.aab`: the app bundle for Google Play.
      - `atvos-launcher-$CI_COMMIT_TAG-debug.apk`: the debug build.
      - `SHA256SUMS`: the SHA-256 digest of each file. Check a download with `sha256sum --check --ignore-missing SHA256SUMS`.
    assets:
      links:
        - name: "atvos-launcher-$CI_COMMIT_TAG.apk"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/atvos-launcher/$CI_COMMIT_TAG/atvos-launcher-$CI_COMMIT_TAG.apk"
          link_type: package
        - name: "atvos-launcher-$CI_COMMIT_TAG.aab"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/atvos-launcher/$CI_COMMIT_TAG/atvos-launcher-$CI_COMMIT_TAG.aab"
          link_type: package
        - name: "atvos-launcher-$CI_COMMIT_TAG-debug.apk"
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/atvos-launcher/$CI_COMMIT_TAG/atvos-launcher-$CI_COMMIT_TAG-debug.apk"
          link_type: package
        - name: SHA256SUMS
          url: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/atvos-launcher/$CI_COMMIT_TAG/SHA256SUMS"
          link_type: other
