# Builds and lints atvOS Launcher. A version tag (v1.0, v1.0-pre.3) also makes a draft release with the APKs, the app
# bundle, their SHA-256 digests (SHA256SUMS) and a signed build provenance attestation. .gitlab-ci.yml runs the same
# build on GitLab.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "LICENSE*", ".gitlab-ci.yml", "website/**", "docs/**", "fastlane/**"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE*", ".gitlab-ci.yml", "website/**", "docs/**", "fastlane/**"]
  workflow_dispatch:

# A new push to a branch cancels its older run. Tag runs always complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install the Android platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      # The upload key, if the repository has the signing secrets. Without them, the release build uses the debug key.
      - name: Set the release signing key
        if: env.KEYSTORE_BASE64 != ''
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build and lint
        run: ./gradlew build bundleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload the lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the release
      id-token: write # the signing certificate of the attestation
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: apks

      - name: Name the files and write their digests
        run: |
          mkdir dist
          cp apks/apk/release/app-release.apk "dist/atvos-launcher-$GITHUB_REF_NAME.apk"
          cp apks/bundle/release/app-release.aab "dist/atvos-launcher-$GITHUB_REF_NAME.aab"
          cp apks/apk/debug/app-debug.apk "dist/atvos-launcher-$GITHUB_REF_NAME-debug.apk"
          (cd dist && sha256sum -- *.apk *.aab > SHA256SUMS && cat SHA256SUMS)

      # A Sigstore-signed SLSA provenance statement: which workflow, commit and runner built each file.
      - name: Attest the build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.apk
            dist/*.aab

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-pre') }}
          make_latest: "false"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            atvOS Launcher ${{ github.ref_name }}, built and linted by GitHub Actions.

            - `atvos-launcher-${{ github.ref_name }}.apk`: the release build, to install with `adb install`. It is signed with the upload key if the repository has the signing secrets, else with a debug key. Uninstall a copy from Google Play first.
            - `atvos-launcher-${{ github.ref_name }}.aab`: the app bundle for Google Play.
            - `atvos-launcher-${{ github.ref_name }}-debug.apk`: the debug build.
            - `SHA256SUMS`: the SHA-256 digest of each file.

            Check a download against its digest and the signed build provenance:

            ```
            sha256sum --check --ignore-missing SHA256SUMS
            gh attestation verify atvos-launcher-${{ github.ref_name }}.apk --repo ${{ github.repository }}
            ```
