# Builds atvOS Launcher, tests it on Android TV emulators, and makes a draft pre-release from a pre-release tag.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*-pre*"]
    paths-ignore: ["**.md", "LICENSE*", ".gitlab-ci.yml"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE*", ".gitlab-ci.yml"]
  workflow_dispatch:

# A new push to a branch cancels its older run. Tag runs always complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install the Android platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      # The upload key, if the repository has the signing secrets. Without them, the release build uses the debug key.
      - name: Set the release signing key
        if: env.KEYSTORE_BASE64 != ''
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build and lint
        run: ./gradlew build bundleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload the lint report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          retention-days: 14

  emulator:
    name: Emulator, Android ${{ matrix.android }} (${{ matrix.target }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { android: 12, api: 31, target: google-tv, arch: x86 }
          - { android: 16, api: 36, target: android-tv, arch: x86_64 }
    env:
      EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: apks

      # Hardware acceleration: KVM for the emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A booted AVD snapshot, so that later runs start the emulator in seconds.
      - name: Restore the AVD
        id: avd
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api }}-${{ matrix.target }}-${{ matrix.arch }}-tv_1080p-v1

      - name: Make the AVD snapshot
        if: steps.avd.outputs.cache-hit != 'true'
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: tv_1080p
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "The AVD snapshot is saved."

      - name: Smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: tv_1080p
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: ./ci/smoke-test.sh apks/apk/debug/app-debug.apk smoke-output

      - name: Upload the screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-android-${{ matrix.android }}-${{ matrix.target }}
          path: smoke-output
          retention-days: 14

  release:
    name: Draft pre-release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: apks

      - name: Name the files
        run: |
          mkdir dist
          cp apks/apk/release/app-release.apk "dist/atvos-launcher-$GITHUB_REF_NAME.apk"
          cp apks/bundle/release/app-release.aab "dist/atvos-launcher-$GITHUB_REF_NAME.aab"
          cp apks/apk/debug/app-debug.apk "dist/atvos-launcher-$GITHUB_REF_NAME-debug.apk"
          (cd dist && sha256sum -- * > SHA256SUMS)

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: true
          make_latest: "false"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            Pre-release build of atvOS Launcher, tested on Android 12 (Google TV) and Android 16 (Android TV) emulators.

            - `atvos-launcher-${{ github.ref_name }}.apk`: the release build, to install with `adb install`. It is signed with the upload key if the repository has the signing secrets, else with a debug key. Uninstall a copy from Google Play first.
            - `atvos-launcher-${{ github.ref_name }}.aab`: the app bundle for Google Play.
            - `atvos-launcher-${{ github.ref_name }}-debug.apk`: the debug build.
