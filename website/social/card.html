<!doctype html>
<!-- The social preview card of atvOS Launcher (og.png, the GitHub social preview, the README banner). Every size is in
     vw and vh, so one card renders at any 2:1-like size. render.swift draws it with WebKit. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
  body {
    position: relative;
    color: #fff;
    font-family: "Inter Display", Inter, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    /* The launcher's aurora: four glows over a dark blue gradient. */
    background:
      radial-gradient(circle 40vw at 102% 102%, rgb(176 48 110 / 0.35), rgb(176 48 110 / 0)),
      radial-gradient(circle 58vw at 52% 100%, rgb(14 138 154 / 0.48), rgb(14 138 154 / 0)),
      radial-gradient(circle 52vw at 84% 26%, rgb(123 63 196 / 0.6), rgb(123 63 196 / 0)),
      radial-gradient(circle 62vw at 18% 20%, rgb(42 79 214 / 0.75), rgb(42 79 214 / 0)),
      linear-gradient(#0b1024, #040509);
  }
  /* The logo: "atvOS Launcher" in one line of Inter Medium. */
  .text { position: absolute; left: 7vw; right: 7vw; top: 9vh; }
  .brand { margin: 0; font-size: 8vh; font-weight: 500; line-height: 1; letter-spacing: -0.02em; }
  .url { position: absolute; right: 7vw; top: 11vh; font-size: 3.6vh; font-weight: 500; color: rgb(255 255 255 / 0.7); }
  h1 { margin: 9vh 0 0; max-width: 80vw; font-size: 8.6vh; font-weight: 700;
        letter-spacing: -0.03em; line-height: 1.06; text-wrap: balance; }
  p { margin: 2.6vh 0 0; font-size: 3.9vh; color: rgb(255 255 255 / 0.72); }
  .dock {
    position: absolute; left: 7vw; right: 7vw; top: 66vh; height: 30vh;
    display: flex; gap: 2.4vw; align-items: center; padding: 0 2.6vw; box-sizing: border-box;
    border-radius: 4.5vh; background: rgb(255 255 255 / 0.1);
    box-shadow: inset 0 0 0 0.2vh rgb(255 255 255 / 0.18), inset 0 0.3vh 0 rgb(255 255 255 / 0.12);
  }
  .tile { flex: 1; aspect-ratio: 5 / 3; border-radius: 2.2vh; display: grid; place-items: center; }
  .tile svg { width: 28%; }
  .tile.focused { transform: scale(1.14); box-shadow: 0 2.4vh 4vh rgb(0 0 0 / 0.45); z-index: 1; }
</style>
</head>
<body>
  <div class="url">atvos.tv</div>
  <div class="text">
    <div class="brand">atvOS Launcher</div>
    <h1>The home screen your TV deserves</h1>
    <p>Free and open source, for Google TV and Android TV</p>
  </div>
  <div class="dock">
      <div class="tile focused" style="background:linear-gradient(160deg,#3d7bff,#1940b0)"><svg viewBox="0 0 24 24" fill="#fff"><path d="M21,3H3c-1.1,0 -2,0.9 -2,2v12c0,1.1 0.9,2 2,2h5v2h8v-2h5c1.1,0 1.99,-0.9 1.99,-2L23,5c0,-1.1 -0.9,-2 -2,-2zM21,17H3V5h18v12z" /></svg></div>
      <div class="tile" style="background:linear-gradient(160deg,#ff6a88,#c2185b)"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" /></svg></div>

      <div class="tile" style="background:linear-gradient(160deg,#3fd884,#0f8f55)"><svg viewBox="0 0 24 24" fill="#fff"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" /></svg></div>
      <div class="tile" style="background:linear-gradient(160deg,#a77bff,#5b2fd6)"><svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z" /></svg></div>

  </div>
</body>
</html>
